<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0E1726"/>
  <!-- Bridge deck arc -->
  <path d="M6 46 Q32 30 58 46" stroke="#5DD0CC" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>
  <!-- Suspender lines -->
  <path d="M18 44 L18 38 M26 41 L26 34 M38 41 L38 34 M46 44 L46 38" stroke="#5DD0CC" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- Left M (navy): tower up, across, slant to center V -->
  <path d="M12 50 L12 14 L20 14 L32 32" stroke="#1B3A6A" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <!-- Right M (teal): mirror -->
  <path d="M52 50 L52 14 L44 14 L32 32" stroke="#1FA8A4" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <!-- Keystone medical cross -->
  <rect x="29" y="36" width="6" height="16" rx="1.2" fill="#FFFFFF"/>
  <rect x="24" y="41" width="16" height="6" rx="1.2" fill="#FFFFFF"/>
</svg>
